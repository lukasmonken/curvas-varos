# Seção 13: ruff, mypy e pytest em todo push e todo pull request.
name: tests

on:
  push:
    paths-ignore:  # commits de dados do workflow diário (o CDS manual continua testado)
      - "data/curves/**"
      - "data/raw/**"
      - "data/latest.json"
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"  # hypothesis em modo determinístico (tests/conftest.py)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
