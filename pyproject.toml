[project]
name = "curvas"
version = "0.1.0"
description = "Plataforma de Curvas VAROS: DI, inflação implícita e CDS em premissas anuais"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "httpx>=0.27",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "plotly>=5.24",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "ruff>=0.8",
    "bizdays>=1.0",  # conferência cruzada do calendário ANBIMA (testes)
]
# Ferramentas offline em tools/: regenerar fixtures do LEGADO (decisão Q7) e
# converter o arquivo de feriados da ANBIMA (.xls). Nunca usadas em runtime.
tools = [
    "formulas>=1.3",
    "xlrd>=2.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curvas"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]
extend-exclude = ["scratch", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT"]
ignore = [
    "PLR2004", # números mágicos são inevitáveis ao espelhar células da planilha
    "PLR0913",
    "RUF001",  # "º" em "1º Tri" é intencional (rótulo da planilha)
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/curvas"]

[[tool.mypy.overrides]]
module = ["formulas.*", "openpyxl.*", "plotly.*"]
ignore_missing_imports = true
